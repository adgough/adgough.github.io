<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaperMap</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        :root {
            --darkColour: #ffa500;
            --darkColourComp: #005aff;
            --lightColour: #fff4df;
        }

        .card {
            cursor: pointer;
        }

        .deleteButton {
            display: inline-block;
            vertical-align: middle;
            content: "×";
            font-size: 0.8rem;
            line-height: 1.2rem;
            right: 0;
            top: 0;
            width: 1.2rem;
            height: 1.2rem;
            border-radius: 1.5rem;
            text-align: center;
            background-color: maroon;
            color: var(--lightColour);
            font-weight: bold;
            margin-left: 0.5rem;
            cursor: pointer;
            user-select: none;
        }

        .createButton {
            margin: 1rem 0 1rem 0;
            cursor: pointer;
            user-select: none;
        }
    </style>
</head>

<body onload="onload()">
    <a href="https://adgough.github.io/" class="title">PaperMap</a>

    <button class="createButton" onclick="window.location.href = 'generator.html';">📝 Create a map</button>
    <div id="mapList">

    </div>

    <script>
        function onload() {
            const matches = Object.entries(localStorage)
                .filter(([key]) => key.startsWith('PaperMap.Map.'))
                .reduce((acc, [key, value]) => {
                    acc[key] = value;
                    return acc;
                }, {});
            Object.entries(matches).forEach(([key, value]) => {
                var map = JSON.parse(value);
                addMap(map.name, map.imageBase64);
            });
        }

        function addMap(name, imageData) {
            var mapList = document.getElementById("mapList");
            var newMapContainer = document.createElement("div");
            newMapContainer.className = "card";
            newMapContainer.onclick = function () {
                sessionStorage.setItem("PaperMap.inboundMap", name);
                window.location.href = 'map.html';
            }
            newMapContainer.innerHTML = `
                <img src="${imageData}">
                <div>
                    <h2>${name}<div class="deleteButton" onclick="deleteMap('PaperMap.Map.${name}')">×</div></h2>
                    <p></p> <!-- placeholder to wire in description field -->
                </div>
            `;
            mapList.insertBefore(newMapContainer, mapList.firstChild);
        }

        function deleteMap(mapKey) {
            localStorage.removeItem(mapKey);
            location.reload();
        }

    </script>
</body>

</html>
