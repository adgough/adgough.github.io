<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaperMap</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        :root {
            --darkColour: #ffa500;
            --darkColourComp: #005aff;
            --lightColour: #fff4df;
        }

        .mapContainer {
            display: inline-block;
            background-color: var(--lightColour);
            box-shadow: 0rem 0.1rem 0.2rem 0.1rem var(--darkColour);
            padding: 0.5rem;
            margin: 0 1rem 1rem 0;
            width: 12rem;
            position: relative;
            cursor: pointer;
            user-select: none;
        }

        .mapContainer h2 {
            margin: 0 0 0.5rem 0;
            font-size: 1rem;
        }

        .mapContainer img {
            height: 6rem;
            max-width: 10rem;
        }

        .mapContainer .deleteButton {
            content: "×";
            position: absolute;
            right: 0;
            top: 0;
            width: 1.5rem;
            line-height: 1.5rem;
            border-radius: 0 0 0 0.5rem;
            text-align: center;
            background-color: maroon;
            color: var(--lightColour);
            font-weight: bold;
        }

        .createButton {
            margin: 1rem 0 1rem 0;
            cursor: pointer;
            user-select: none;
        }
    </style>
</head>

<body onload="onload()">
    <a href="https://adgough.github.io/" class="title">PaperMap</a>

    <button class="createButton" onclick="window.location.href = 'generator.html';">📝 Create a map</button>
    <div id="mapList">

    </div>

    <script>
        function onload() {
            const matches = Object.entries(localStorage)
                .filter(([key]) => key.startsWith('PaperMap.Map.'))
                .reduce((acc, [key, value]) => {
                    acc[key] = value;
                    return acc;
                }, {});
            Object.entries(matches).forEach(([key, value]) => {
                var map = JSON.parse(value);
                addMap(map.name, map.imageBase64);
            });
        }

        function addMap(name, imageData) {
            var mapList = document.getElementById("mapList");
            var newMapContainer = document.createElement("div");
            newMapContainer.className = "mapContainer";
            newMapContainer.onclick = function () {
                sessionStorage.setItem("PaperMap.inboundMap",name);
                window.location.href = 'map.html';
            }
            newMapContainer.innerHTML = `
                <h2>${name}</h2>
                <div class="deleteButton" onclick="deleteMap('PaperMap.Map.${name}')">×</div>
                <img src="${imageData}">
            `;
            mapList.insertBefore(newMapContainer, mapList.firstChild);
        }

        function deleteMap(mapKey) {
            localStorage.removeItem(mapKey);
            location.reload();
        }

    </script>
</body>

</html>
