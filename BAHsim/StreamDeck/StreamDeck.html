<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAHsim - StreamDeck</title>
    <style>
        #StreamDeckMonitor {
            margin: 2rem;
            font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
            #sdmFrame {
                outline: 1rem rgb(30, 30, 30) solid;
                width: 32rem;
                height: 18rem;
                display: flex;
                flex-wrap: wrap;
            }
                .sdmBigView {
                    background-color: purple;
                    width: 16rem;
                    height: 8rem;
                    border: 1px white solid;
                    box-sizing: border-box;
                    background-position: center;
                    background-size: cover;
                }
                .sdmProgram {
                    display: inline;
                    width: calc(16rem - 2px);
                    height: calc(8rem - 2px);
                    position: absolute;
                    background-position: center;
                    background-size: cover;
                }
                #sdmProgramTop {
                    background-color: black;
                    filter: brightness(100%);
                }
                #sdmProgramBottom {
                    background-color: black;
                }
                .sdmSmallView {
                    background-color: black;
                    width: 8rem;
                    height: 5rem;
                    border: 1px white solid;
                    box-sizing: border-box;
                    background-position: center;
                    background-size: cover;
                }
                .sdmAnnotation {
                    background-color: black;
                    color: white;
                    opacity: 0.8;
                    text-align: center;
                    width: 5rem;
                    height: 1rem;
                    border-radius: 0.5rem;
                    font-size: 0.8rem;
                    position: relative;
                }
                .sdmBigView .sdmAnnotation {
                    left: 5rem;
                    top: 6.5rem
                }
                .sdmSmallView .sdmAnnotation {
                    left: 1.5rem;
                    top: 3.5rem
                }
                .sdmArmed {
                    outline: 4px green solid;
                    outline-offset: -4px;
                }
                .sdmArmed .sdmAnnotation {
                    background-color: green;
                }
                .sdmActive {
                    outline: 4px red solid;
                    outline-offset: -4px;
                }
                .sdmActive .sdmAnnotation {
                    background-color: red;
                }

                #sdmCam1 {background-image: url(Cam1.jpg);}
                #sdmCam2 {background-image: url(Cam2.jpg);}
                #sdmCam3 {background-image: url(Cam3.jpg);}
                #sdmCam4 {background-image: url(Cam4.jpg);}
                #sdmMediaMain {background-image: url(MediaMain.jpg);}
                #sdmMediaBkp {background-image: url(MediaBkp.jpg);}
                #sdmCam5 {background-image: url(Cam5.jpg);}

        
        #StreamDeck {
                background-color: rgb(60, 60, 60);
                box-shadow: 0.3rem 0.5rem rgb(30, 30, 30);
                font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                border-radius: 1rem;
                width: 28rem;
                margin: 1rem
            }
            #sdLogo {
                color: white;
                padding: 1rem 0 0 0;
                font-size: 1.3rem;
                font-weight: bold;
                user-select: none;
            }
            #sdButtons {
                display: flex;
                flex-direction: row;
                flex-wrap: wrap;
                margin: 1rem;
                font-size: 1.1rem;
            }
                .sdButton {
                    margin: 0.5rem;
                    width: 4rem;
                    border-radius: 0.8rem;
                    outline: 3px rgb(80,80,40) solid;
                    user-select: none;
                    cursor: pointer;
                }
                .sdButton:active {
                    outline: 1rem orangered solid;
                }
                    .sdButtonHeader {
                        background-color: black;
                        color: yellow;
                        border-bottom: 2px yellow solid;
                        font-size: 0.5rem;
                        padding: 0.2rem;
                        border-radius: 0.8rem 0.8rem 0 0;
                        height: 1rem;
                        box-sizing: border-box;
                    }
                    .sdButtonBody {
                        padding: 0.2rem;
                        border-radius:  0 0 0.8rem 0.8rem;
                        height: 3rem;
                        box-sizing: border-box;
                        text-align: center;
                    }
                    .sdButtonYellow .sdButtonBody {
                        background-color: palegoldenrod;
                    }
                    .sdButtonGreen .sdButtonBody {
                        background-color: green;
                        color: white;
                    }
                    .sdButtonRed .sdButtonBody {
                        background-color: red;
                        color: white;
                    }
                    .sdButtonBlack .sdButtonBody {
                        background-color: black;
                        color: white;
                    }
    </style>
</head>
<body ontouchstart>
    <div id="StreamDeckMonitor">
        <div id="sdmFrame">
            <div class="sdmBigView" id="sdmPreview">
                <div class="sdmAnnotation">Preview</div>
            </div>
            <div class="sdmBigView">
                <div class="sdmProgram" id="sdmProgramBottom"></div>
                <div class="sdmProgram" id="sdmProgramTop"></div>
                <div class="sdmAnnotation">Program</div>
            </div>
            <div class="sdmSmallView sdmArmed" id="sdmCam1">
                <div class="sdmAnnotation">Camera 1</div>
            </div>
            <div class="sdmSmallView sdmActive" id="sdmCam2">
                <div class="sdmAnnotation">Camera 2</div>
            </div>
            <div class="sdmSmallView" id="sdmCam3">
                <div class="sdmAnnotation">Camera 3</div>
            </div>
            <div class="sdmSmallView" id="sdmCam4">
                <div class="sdmAnnotation">Pool Camera</div>
            </div>
            <div class="sdmSmallView" id="sdmMediaMain">
                <div class="sdmAnnotation">Media Main</div>
            </div>
            <div class="sdmSmallView" id="sdmMediaBkp">
                <div class="sdmAnnotation">Media Backup</div>
            </div>
            <div class="sdmSmallView">
                <div class="sdmAnnotation">Not used</div>
            </div>
            <div class="sdmSmallView" id="sdmCam5">
                <div class="sdmAnnotation">Camera 5</div>
            </div>
        </div>
    </div>
    
    <div id="StreamDeck">
        <div id="sdLogo">⋣ STREAM DECK</div>
        <div id="sdButtons">
            <div onclick="sdInputClick(this.id)" class="sdButton" id="sdButtonCam1">
                <div class="sdButtonHeader">1/0/0</div>
                <div class="sdButtonBody">CAM<br>1</div>
            </div>
            <div onclick="sdInputClick(this.id)" class="sdButton" id="sdButtonCam2">
                <div class="sdButtonHeader">1/0/1</div>
                <div class="sdButtonBody">CAM<br>2</div>
            </div>
            <div onclick="sdInputClick(this.id)" class="sdButton sdButtonYellow" id="sdButtonCam3">
                <div class="sdButtonHeader">1/0/2</div>
                <div class="sdButtonBody">CAM<br>3</div>
            </div>
            <div onclick="sdInputClick(this.id)" class="sdButton sdButtonYellow" id="sdButtonCam4">
                <div class="sdButtonHeader">1/0/3</div>
                <div class="sdButtonBody">CAM 4<br>Pool</div>
            </div>
            <div onclick="sdSwitchClick(this.id)" class="sdButton sdButtonBlack" id="sdButtonCut">
                <div class="sdButtonHeader">1/0/4</div>
                <div class="sdButtonBody">CUT</div>
            </div>

            <div onclick="sdInputClick(this.id)" class="sdButton sdButtonYellow" id="sdButtonMediaMain">
                <div class="sdButtonHeader">1/1/0</div>
                <div class="sdButtonBody">MEDIA<br>MAIN</div>
            </div>
            <div onclick="sdInputClick(this.id)" class="sdButton sdButtonYellow" id="sdButtonMediaBkp">
                <div class="sdButtonHeader">1/1/1</div>
                <div class="sdButtonBody">MEDIA<br>BKP</div>
            </div>
            <div class="sdButton sdButtonBlack" id="sdButtonBlank1">
                <div class="sdButtonHeader"></div>
                <div class="sdButtonBody"></div>
            </div>
            <div onclick="sdInputClick(this.id)" class="sdButton sdButtonYellow" id="sdButtonCam5">
                <div class="sdButtonHeader">1/1/3</div>
                <div class="sdButtonBody">CAM<br>5</div>
            </div>
            <div onclick="sdSwitchClick(this.id)" class="sdButton sdButtonBlack" id="sdButtonAuto">
                <div class="sdButtonHeader">1/1/4</div>
                <div class="sdButtonBody">AUTO</div>
            </div>

            <div class="sdButton sdButtonBlack" id="sdButtonBlank2">
                <div class="sdButtonHeader"></div>
                <div class="sdButtonBody"></div>
            </div>
            <div class="sdButton sdButtonBlack" id="sdButtonBlank3">
                <div class="sdButtonHeader"></div>
                <div class="sdButtonBody"></div>
            </div>
            <div class="sdButton sdButtonBlack" id="sdButtonBlank4">
                <div class="sdButtonHeader"></div>
                <div class="sdButtonBody"></div>
            </div>
            <div class="sdButton sdButtonBlack" id="sdButtonBlank5">
                <div class="sdButtonHeader"></div>
                <div class="sdButtonBody"></div>
            </div>
            <div onclick="sdSwitchClick(this.id)" class="sdButton sdButtonRed" id="sdButtonFTB">
                <div class="sdButtonHeader">1/2/4</div>
                <div class="sdButtonBody">FTB</div>
            </div>
        </div>
    </div>

    


    <script>
        var sdActiveInput = "sdButtonCam1";
        var sdArmedInput = "sdButtonCam2";
        var sdmCurrentOpacity = 1;
        var sdmCurrentBrightness = 1;
        var fadeStartDateTime = "";
        var fadeLengthSeconds = 1;
        var ftbStartDateTime = "";
        var ftbLengthSeconds = 1;
        var isFTBActive = false;

        function sdInputClick(id) {
            if(id == sdActiveInput) {return}
            else {
                sdArmedInput = id;
            }
        }
        function sdSwitchClick(id) {
            if (id === "sdButtonCut" || id === "sdButtonAuto") {
                var newArmed = sdActiveInput;
                var newActive = sdArmedInput;
                sdActiveInput = newActive;
                sdArmedInput = newArmed;
            }
            if (id === "sdButtonCut") {
                sdmCurrentOpacity = 1;
            }
            if (id === "sdButtonAuto") {
                fadeStartDateTime = new Date().getTime();
            }
            if (id === "sdButtonFTB") {
                ftbStartDateTime = new Date().getTime();
                isFTBActive = !isFTBActive;
            }
        }

        function draw()
        {
            // StreamDeck
            var sdButtons = Array.from(document.getElementsByClassName("sdButton"));
            sdButtons.forEach(button => {
                if(button.id === sdArmedInput) {
                    button.classList.add("sdButtonGreen");
                    button.classList.remove("sdButtonYellow");
                    button.classList.remove("sdButtonRed");
                } else if(button.id === sdActiveInput) {
                    button.classList.add("sdButtonRed");
                    button.classList.remove("sdButtonYellow");
                    button.classList.remove("sdButtonGreen");
                } else if(button.id === "sdButtonFTB") {
                    if(isFTBActive) {
                        button.classList.add("sdButtonRed");
                        button.classList.remove("sdButtonYellow");
                    } else {
                        button.classList.remove("sdButtonRed");
                        button.classList.add("sdButtonYellow");
                    }
                } else {
                    button.classList.remove("sdButtonGreen");
                    button.classList.remove("sdButtonRed");
                    button.classList.add("sdButtonYellow");
                }
            });

            // StreamDeck monitor
            var sdmArmedView = "sdm" + sdArmedInput.replace("sdButton","");
            var sdmActiveView = "sdm" + sdActiveInput.replace("sdButton","");
            var sdmSmallViews = Array.from(document.getElementsByClassName("sdmSmallView"));
            sdmSmallViews.forEach(smallView => {
                if(smallView.id === sdmArmedView) {
                    smallView.classList.add("sdmArmed");
                    smallView.classList.remove("sdmActive");
                } else if(smallView.id === sdmActiveView) {
                    smallView.classList.add("sdmActive");
                    smallView.classList.remove("sdmArmed");
                } else {
                    smallView.classList.remove("sdmArmed");
                    smallView.classList.remove("sdmActive");
                }
            });
            
            var sdmProgramTop = document.getElementById("sdmProgramTop");
            var sdmProgramBottom = document.getElementById("sdmProgramBottom");
            var sdmPreview = document.getElementById("sdmPreview");
            var previewImage = sdArmedInput.replace("sdButton", "") +".jpg";
            var programImage = sdActiveInput.replace("sdButton", "") +".jpg";

            sdmCurrentOpacity = (new Date().getTime() - fadeStartDateTime)/(fadeLengthSeconds * 1000);
            sdmCurrentOpacity = Math.max(0, Math.min((new Date().getTime() - fadeStartDateTime) / (fadeLengthSeconds * 1000), 1));
            

            sdmCurrentBrightness = Math.max(0, Math.min((new Date().getTime() - ftbStartDateTime) / (ftbLengthSeconds * 1000), 1));
            if(isFTBActive) {sdmCurrentBrightness = 1 - sdmCurrentBrightness};

            sdmProgramTop.style.opacity = sdmCurrentOpacity;
            sdmProgramTop.style.filter = "brightness(" + (sdmCurrentBrightness * 100) + "%)";
            sdmProgramBottom.style.filter = "brightness(" + (sdmCurrentBrightness * 100) + "%)"
            
            sdmProgramTop.style.backgroundImage="url(" + programImage + ")"
            sdmProgramBottom.style.backgroundImage="url(" + previewImage + ")"
            sdmPreview.style.backgroundImage="url(" + previewImage + ")"

            requestAnimationFrame(draw);
        }
        requestAnimationFrame(draw);

        // Disable double tap zoom, because Apple is stupid.
        document.ondblclick = function(e) {
            e.preventDefault();
        }
    </script>
</body>
</html>
